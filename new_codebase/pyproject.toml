[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-sensing"
version = "0.1.0"
description = "Standalone fiber shape sensing algorithms and tools"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "pandas", "PyYAML", "importlib-resources>=5; python_version < '3.9'"]

[project.optional-dependencies]
gui = ["matplotlib", "PyQt5", "vtk"]
runtime = ["pyserial"]
test = ["pytest>=7", "setuptools>=65", "wheel"]

[project.scripts]
shape-sensing = "shape_sensing.cli:main"

[tool.setuptools.packages.find]
include = ["shape_sensing*"]

[tool.setuptools.package-data]
shape_sensing = ["configuration/parameters.json", "resources/*.yaml"]

[tool.pytest.ini_options]
cache_dir = "artifacts/testing/cache"
